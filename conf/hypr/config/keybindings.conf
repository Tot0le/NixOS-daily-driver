# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ KEYBINDINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ───────── Mouse   Gestures ─────────
gesture = 3, horizontal, workspace

# ───────── Window Management ─────────
binde = $mainMod SHIFT, left, resizeactive,-50 0
binde = $mainMod SHIFT, right, resizeactive,50 0
binde = $mainMod SHIFT, up, resizeactive,0 -50
binde = $mainMod SHIFT, down, resizeactive,0 50

bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = ALT, F4, exec, hyprctl dispatch killactive
bind = $mainMod SHIFT, F, togglefloating,

# ───────── System   Hardware ─────────
# bindl = ALT_L, SHIFT, exec, hyprctl switchxkblayout main prev
# bindl = SHIFT, ALT_L, exec, hyprctl switchxkblayout main next

bindl = , XF86MonBrightnessDown, exec, serpantinum brightness lower
bindl = , XF86MonBrightnessUp, exec, serpantinum brightness raise
bindl = , Print, exec, serpantinum screenshot
bindl = SHIFT, Print, exec, serpantinum screenshot --edit
bindl = SUPER, Print, exec, serpantinum screenshot --full
bindl = SUPER SHIFT, Print, exec, serpantinum screenshot --full --edit
bindl = , XF86PowerOff, exec, serpantinum lock

# ───────── Media   Audio ─────────
bindl = $mainMod, SPACE, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioMicMute, exec, serpantinum volume mic-toggle
bindl = , XF86AudioMute, exec, serpantinum volume mute-toggle
bindel = , XF86AudioLowerVolume, exec, serpantinum volume lower
bindel = , XF86AudioRaiseVolume, exec, serpantinum volume raise

