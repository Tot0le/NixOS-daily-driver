# Serpantinum: bar, launcher, notifications, wallpaper, idle and focus tracking
exec-once = serpantinumd start

# The shell talks to media players through playerctld
exec-once = playerctld

# Clipboard history for the shell's clipboard manager (same as the upstream example)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = systemctl --user enable --now easyeffects

